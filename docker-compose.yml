services:
  abrechnung:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Pflicht
      SEVDESK_API_TOKEN: ${SEVDESK_API_TOKEN:?SEVDESK_API_TOKEN fehlt}
      # Pflicht - Anmeldung ueber Microsoft Entra ID
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?ENTRA_TENANT_ID fehlt}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?ENTRA_CLIENT_ID fehlt}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?ENTRA_CLIENT_SECRET fehlt}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt}
      # Optional - ohne Angabe aus der aufgerufenen Adresse gebildet
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-}
      # Optional - Zugang auf bestimmte Konten/Gruppen begrenzen
      ENTRA_ERLAUBTE_BENUTZER: ${ENTRA_ERLAUBTE_BENUTZER:-}
      ENTRA_ERLAUBTE_GRUPPEN: ${ENTRA_ERLAUBTE_GRUPPEN:-}
      SESSION_DAUER_SEKUNDEN: ${SESSION_DAUER_SEKUNDEN:-28800}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Optional - leer lassen, dann waehlt der Server das Konto selbst
      SEVDESK_CHECK_ACCOUNT_ID: ${SEVDESK_CHECK_ACCOUNT_ID:-}
      # Optional - Rechnungsabruf aus dem OneDrive-Gutachtenordner
      N8N_FIND_RECHNUNG_URL: ${N8N_FIND_RECHNUNG_URL:-}
      # Optional - Belegablage in die OneDrive-Monatsordner; nur beide
      # zusammen schalten sie frei, sonst bleibt es bei der Vorschau
      N8N_ORDNER_URL: ${N8N_ORDNER_URL:-}
      N8N_ABLAGE_URL: ${N8N_ABLAGE_URL:-}
      # Optional - vorhandene Dateien verschieben statt Kopien hochzuladen
      N8N_ORDNER_DATEIEN_URL: ${N8N_ORDNER_DATEIEN_URL:-}
      N8N_VERSCHIEBE_URL: ${N8N_VERSCHIEBE_URL:-}
      # Drosselung der Ablage - hochsetzen, wenn n8n ins Schwitzen kommt
      N8N_ABLAGE_PAUSE_MS: ${N8N_ABLAGE_PAUSE_MS:-}
      N8N_ABLAGE_VERSUCHE: ${N8N_ABLAGE_VERSUCHE:-}
      N8N_WEBHOOK_AUTH_HEADER: ${N8N_WEBHOOK_AUTH_HEADER:-}
      N8N_WEBHOOK_AUTH_VALUE: ${N8N_WEBHOOK_AUTH_VALUE:-}
      # Optional - kann jederzeit spaeter nachgetragen werden
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-high}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - abrechnung-daten:/data

volumes:
  abrechnung-daten:
